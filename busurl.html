<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>マイバス接近情報</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      background-color: #0099e5;
    }

    /* 上部青色ヘッダー */
    .header {
      background-color: #008be2;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      height: 48px;
      flex-shrink: 0;
    }
    .header-title {
      font-size: 1.05rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.5px;
    }
    .header-btn {
      background: none;
      border: none;
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .header-btn:active {
      opacity: 0.7;
    }

    /* 横スクロールタブバー */
    .tab-bar {
      background-color: #ffffff;
      display: flex;
      overflow-x: auto;
      white-space: nowrap;
      height: 44px;
      flex-shrink: 0;
      border-bottom: 1px solid #d1d5db;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .tab-bar::-webkit-scrollbar {
      display: none;
    }
    .tab-item {
      padding: 0 16px;
      height: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      font-weight: bold;
      color: #333333;
      cursor: pointer;
      border: none;
      background: none;
      border-radius: 8px 8px 0 0;
      transition: background-color 0.15s, color 0.15s;
      flex-shrink: 0;
    }
    .tab-item.active {
      background-color: #e3f2fd;
      color: #0077c8;
    }

    /* 接近情報 iframe 表示コンテナ */
    .frame-container {
      flex: 1;
      width: 100%;
      background: #0099e5;
      position: relative;
    }
    .frame-container iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* 設定モーダル */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
      padding: 16px;
      z-index: 9999;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-content {
      background: #fff;
      border-radius: 12px;
      width: 100%;
      max-width: 440px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 18px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      color: #333;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid #eee;
    }
    .modal-header h2 {
      font-size: 1.1rem;
    }
    .close-btn {
      background: none;
      border: none;
      font-size: 1.6rem;
      cursor: pointer;
      color: #666;
      line-height: 1;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
      background: #f8fafc;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
    }
    .form-group label {
      font-size: 0.8rem;
      font-weight: bold;
      color: #475569;
    }
    .form-group input {
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.95rem;
    }
    .btn-add {
      background: #008be2;
      color: #fff;
      border: none;
      padding: 9px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 4px;
    }
    .btn-add:hover {
      background: #0077c8;
    }
    .list-title {
      font-size: 0.9rem;
      font-weight: bold;
      margin-bottom: 8px;
      color: #475569;
    }
    .registered-items {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }
    .item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff;
      border: 1px solid #e2e8f0;
      padding: 8px 12px;
      border-radius: 6px;
    }
    .item-info {
      overflow: hidden;
      margin-right: 8px;
    }
    .item-title {
      font-weight: bold;
      font-size: 0.9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-url {
      font-size: 0.75rem;
      color: #64748b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn-delete {
      background: #ef4444;
      color: #fff;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
      flex-shrink: 0;
    }
    .reset-area {
      text-align: right;
    }
    .btn-reset {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 0.75rem;
      cursor: pointer;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- ヘッダー -->
  <div class="header">
    <div class="header-title">🚌 マイバス接近情報</div>
    <button class="header-btn" id="openModalBtn" title="設定" aria-label="設定">⚙️</button>
  </div>

  <!-- 横並びのタブ一覧 -->
  <div class="tab-bar" id="tabBar"></div>

  <!-- 接近情報表示エリア -->
  <div class="frame-container">
    <iframe id="busFrame" src="" title="接近情報"></iframe>
  </div>

  <!-- 設定モーダル -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>停留所タブ設定</h2>
        <button class="close-btn" id="closeModalBtn">&times;</button>
      </div>

      <!-- 新規登録フォーム -->
      <form id="addForm" class="form-group">
        <label for="titleInput">タブ名称（停留所名）</label>
        <input type="text" id="titleInput" placeholder="例: 八丁堀" required>

        <label for="urlInput">URL</label>
        <input type="url" id="urlInput" placeholder="https://kuruken.jp/..." required>

        <button type="submit" class="btn-add">追加する</button>
      </form>

      <!-- 登録一覧 -->
      <div class="list-title">登録中のタブ一覧</div>
      <div class="registered-items" id="registeredItems"></div>

      <div class="reset-area">
        <button class="btn-reset" id="resetDefaultBtn">初期設定に戻す</button>
      </div>
    </div>
  </div>

  <script>
    // 2枚目の画像に合わせた初期デフォルト一覧
    const DEFAULT_BUS_ITEMS = [
      { title: "下岩の上", url: "https://kuruken.jp/Approaching?busstopId=1626" },
      { title: "女学院前", url: "https://kuruken.jp/Approaching?busstopId=1625" },
      { title: "広島BC",   url: "https://kuruken.jp/Approaching?busstopId=1623" },
      { title: "広島駅",   url: "https://kuruken.jp/Approaching?busstopId=1622" },
      { title: "八丁堀",   url: "https://kuruken.jp/Approaching?busstopId=1624" }
    ];

    const STORAGE_KEY = 'kuruken_bus_items';
    let currentIndex = 0;

    // データ読み込み
    function loadItems() {
      const data = localStorage.getItem(STORAGE_KEY);
      if (data) {
        try {
          return JSON.parse(data);
        } catch (e) {
          console.error("データ読み込み失敗", e);
        }
      }
      return [...DEFAULT_BUS_ITEMS];
    }

    // データ保存
    function saveItems(items) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    }

    // タブおよびiframeの表示更新
    function renderTabs(items) {
      const tabBar = document.getElementById('tabBar');
      const frame = document.getElementById('busFrame');
      tabBar.innerHTML = '';

      if (items.length === 0) {
        frame.src = 'about:blank';
        return;
      }

      if (currentIndex >= items.length) {
        currentIndex = 0;
      }

      items.forEach((item, index) => {
        const btn = document.createElement('button');
        btn.className = `tab-item ${index === currentIndex ? 'active' : ''}`;
        btn.textContent = item.title;
        btn.onclick = () => {
          currentIndex = index;
          updateActiveTab(items);
        };
        tabBar.appendChild(btn);
      });

      frame.src = items[currentIndex].url;
    }

    function updateActiveTab(items) {
      const tabs = document.querySelectorAll('.tab-item');
      tabs.forEach((tab, i) => {
        tab.classList.toggle('active', i === currentIndex);
      });
      const frame = document.getElementById('busFrame');
      if (items[currentIndex]) {
        frame.src = items[currentIndex].url;
      }
    }

    // モーダル内の登録アイテム一覧描画
    function renderSettingsList(items) {
      const container = document.getElementById('registeredItems');
      container.innerHTML = '';

      if (items.length === 0) {
        container.innerHTML = '<div style="font-size:0.85rem; color:#94a3b8;">登録されている停留所はありません。</div>';
        return;
      }

      items.forEach((item, index) => {
        const row = document.createElement('div');
        row.className = 'item-row';

        const info = document.createElement('div');
        info.className = 'item-info';
        info.innerHTML = `<div class="item-title">${escapeHtml(item.title)}</div><div class="item-url">${escapeHtml(item.url)}</div>`;

        const delBtn = document.createElement('button');
        delBtn.className = 'btn-delete';
        delBtn.textContent = '削除';
        delBtn.onclick = () => {
          items.splice(index, 1);
          if (currentIndex >= items.length) {
            currentIndex = Math.max(0, items.length - 1);
          }
          saveItems(items);
          renderAll();
        };

        row.appendChild(info);
        row.appendChild(delBtn);
        container.appendChild(row);
      });
    }

    function escapeHtml(str) {
      return str.replace(/[&<>'"]/g, tag => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        "'": '&#39;',
        '"': '&quot;'
      }[tag] || tag));
    }

    function renderAll() {
      const items = loadItems();
      renderTabs(items);
      renderSettingsList(items);
    }

    // モーダル操作
    const modal = document.getElementById('settingsModal');
    document.getElementById('openModalBtn').addEventListener('click', () => {
      modal.classList.add('active');
    });
    document.getElementById('closeModalBtn').addEventListener('click', () => {
      modal.classList.remove('active');
    });
    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.classList.remove('active');
    });

    // 新規登録
    document.getElementById('addForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const titleInput = document.getElementById('titleInput');
      const urlInput = document.getElementById('urlInput');

      const newItem = {
        title: titleInput.value.trim(),
        url: urlInput.value.trim()
      };

      const items = loadItems();
      items.push(newItem);
      saveItems(items);
      renderAll();

      titleInput.value = '';
      urlInput.value = '';
    });

    // 初期化
    document.getElementById('resetDefaultBtn').addEventListener('click', () => {
      if (confirm('初期設定（下岩の上・女学院前・広島BC・広島駅・八丁堀）に戻しますか？')) {
        saveItems(DEFAULT_BUS_ITEMS);
        currentIndex = 0;
        renderAll();
      }
    });

    // 実行
    renderAll();
  </script>
</body>
</html>
