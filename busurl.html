<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>マイバス接近情報</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      background-color: #008be2;
    }

    /* ヘッダー */
    .header {
      background-color: #008be2;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 12px;
      height: 48px;
      flex-shrink: 0;
    }
    .header-title {
      font-size: 1.05rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .settings-btn {
      background: none;
      border: none;
      font-size: 1.4rem;
      cursor: pointer;
      color: #fff;
      padding: 4px;
      line-height: 1;
    }

    /* タブ切り替えバー */
    .tab-bar {
      background-color: #ffffff;
      display: flex;
      overflow-x: auto;
      white-space: nowrap;
      height: 44px;
      flex-shrink: 0;
      border-bottom: 1px solid #d1d5db;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .tab-bar::-webkit-scrollbar {
      display: none;
    }
    .tab-item {
      padding: 0 16px;
      height: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      font-weight: bold;
      color: #333333;
      cursor: pointer;
      border: none;
      background: none;
      border-radius: 8px 8px 0 0;
      flex-shrink: 0;
    }
    .tab-item.active {
      background-color: #e3f2fd;
      color: #0077c8;
    }

    /* 接近情報 iframe 表示エリア */
    .frame-container {
      flex: 1;
      width: 100%;
      background: #0099e5;
      position: relative;
    }
    .frame-container iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* 設定モーダル */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
      padding: 16px;
      z-index: 9999;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-content {
      background: #fff;
      border-radius: 12px;
      width: 100%;
      max-width: 440px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 18px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      color: #333;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid #eee;
    }
    .modal-header h2 {
      font-size: 1.1rem;
    }
    .close-btn {
      background: none;
      border: none;
      font-size: 1.6rem;
      cursor: pointer;
      color: #666;
      line-height: 1;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
      background: #f8fafc;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
    }
    .form-group label {
      font-size: 0.8rem;
      font-weight: bold;
      color: #475569;
    }
    .form-group input {
      padding: 9px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.95rem;
    }
    .form-actions {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }
    .btn-submit {
      flex: 1;
      background: #008be2;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-cancel {
      display: none;
      background: #94a3b8;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .list-title {
      font-size: 0.9rem;
      font-weight: bold;
      margin-bottom: 8px;
      color: #475569;
    }
    .registered-items {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }
    .item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff;
      border: 1px solid #e2e8f0;
      padding: 8px 10px;
      border-radius: 6px;
    }
    .item-info {
      overflow: hidden;
      margin-right: 8px;
      flex: 1;
    }
    .item-title {
      font-weight: bold;
      font-size: 0.9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-url {
      font-size: 0.72rem;
      color: #64748b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }
    .btn-action {
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-edit {
      background: #0ea5e9;
      color: #fff;
    }
    .btn-delete {
      background: #ef4444;
      color: #fff;
    }
    .reset-area {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 6px;
    }
    .btn-text {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 0.75rem;
      cursor: pointer;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- ヘッダー -->
  <div class="header">
    <div class="header-title">🚌 マイバス接近情報</div>
    <button class="settings-btn" id="openModalBtn" title="設定" aria-label="設定">⚙️</button>
  </div>

  <!-- タブバー -->
  <div class="tab-bar" id="tabBar"></div>

  <!-- 表示用 iframe -->
  <div class="frame-container">
    <iframe id="busFrame" src="" title="接近情報"></iframe>
  </div>

  <!-- 設定モーダル -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalFormTitle">停留所タブの追加</h2>
        <button class="close-btn" id="closeModalBtn">&times;</button>
      </div>

      <!-- フォーム（URLバリデーションエラーを防ぐためtext型に修正） -->
      <form id="busForm" class="form-group">
        <input type="hidden" id="editIndex" value="-1">
        <label for="titleInput">タブ名称（停留所名）</label>
        <input type="text" id="titleInput" placeholder="例: 八丁堀" required>

        <label for="urlInput">URL</label>
        <input type="text" id="urlInput" placeholder="https://kuruken.jp/..." required>

        <div class="form-actions">
          <button type="button" class="btn-cancel" id="cancelEditBtn">キャンセル</button>
          <button type="submit" class="btn-submit" id="submitBtn">登録する</button>
        </div>
      </form>

      <!-- 一覧 -->
      <div class="list-title">登録中のタブ一覧</div>
      <div class="registered-items" id="registeredItems"></div>

      <div class="reset-area">
        <button class="btn-text" id="resetDefaultBtn">初期設定に戻す</button>
        <button class="btn-text" id="clearAllBtn">全て消去</button>
      </div>
    </div>
  </div>

  <script>
    // 実際に動作する広島バス接近情報の初期値
    const DEFAULT_BUS_ITEMS = [
      { title: "下岩の上", url: "https://kuruken.jp/Approaching?busstopId=1626" },
      { title: "女学院前", url: "https://kuruken.jp/Approaching?busstopId=1625" },
      { title: "広島BC",   url: "https://kuruken.jp/Approaching?busstopId=1623" },
      { title: "広島駅",   url: "https://kuruken.jp/Approaching?busstopId=1622" },
      { title: "八丁堀",   url: "https://kuruken.jp/Approaching?busstopId=1624" }
    ];

    // キャッシュ衝突を防ぐためキー名を更新
    const STORAGE_KEY = 'kuruken_bus_items_v3';
    let currentIndex = 0;

    function loadItems() {
      const data = localStorage.getItem(STORAGE_KEY);
      if (data) {
        try {
          const parsed = JSON.parse(data);
          if (Array.isArray(parsed)) return parsed;
        } catch (e) {
          console.error(e);
        }
      }
      return [...DEFAULT_BUS_ITEMS];
    }

    function saveItems(items) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    }

    function renderTabs(items) {
      const tabBar = document.getElementById('tabBar');
      const frame = document.getElementById('busFrame');
      tabBar.innerHTML = '';

      if (items.length === 0) {
        frame.src = 'about:blank';
        return;
      }

      if (currentIndex >= items.length) {
        currentIndex = 0;
      }

      items.forEach((item, index) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `tab-item ${index === currentIndex ? 'active' : ''}`;
        btn.textContent = item.title;
        btn.onclick = () => {
          currentIndex = index;
          updateActiveTab(items);
        };
        tabBar.appendChild(btn);
      });

      if (items[currentIndex]) {
        frame.src = items[currentIndex].url;
      }
    }

    function updateActiveTab(items) {
      const tabs = document.querySelectorAll('.tab-item');
      tabs.forEach((tab, i) => {
        tab.classList.toggle('active', i === currentIndex);
      });
      const frame = document.getElementById('busFrame');
      if (items[currentIndex]) {
        frame.src = items[currentIndex].url;
      }
    }

    function renderSettingsList(items) {
      const container = document.getElementById('registeredItems');
      container.innerHTML = '';

      if (items.length === 0) {
        container.innerHTML = '<div style="font-size:0.85rem; color:#94a3b8; text-align:center; padding:10px;">登録がありません。上部から追加してください。</div>';
        return;
      }

      items.forEach((item, index) => {
        const row = document.createElement('div');
        row.className = 'item-row';

        const info = document.createElement('div');
        info.className = 'item-info';
        info.innerHTML = `<div class="item-title">${escapeHtml(item.title)}</div><div class="item-url">${escapeHtml(item.url)}</div>`;

        const actions = document.createElement('div');
        actions.className = 'item-actions';

        // 編集ボタン
        const editBtn = document.createElement('button');
        editBtn.type = 'button';
        editBtn.className = 'btn-action btn-edit';
        editBtn.textContent = '編集';
        editBtn.onclick = () => {
          document.getElementById('titleInput').value = item.title;
          document.getElementById('urlInput').value = item.url;
          document.getElementById('editIndex').value = index;
          document.getElementById('submitBtn').textContent = '変更を保存';
          document.getElementById('modalFormTitle').textContent = '停留所タブの編集';
          document.getElementById('cancelEditBtn').style.display = 'block';
          document.querySelector('.modal-content').scrollTop = 0;
        };

        // 削除ボタン
        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'btn-action btn-delete';
        delBtn.textContent = '削除';
        delBtn.onclick = () => {
          items.splice(index, 1);
          if (currentIndex >= items.length) {
            currentIndex = Math.max(0, items.length - 1);
          }
          saveItems(items);
          renderAll();
          resetForm();
        };

        actions.appendChild(editBtn);
        actions.appendChild(delBtn);
        row.appendChild(info);
        row.appendChild(actions);
        container.appendChild(row);
      });
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>'"]/g, tag => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        "'": '&#39;',
        '"': '&quot;'
      }[tag] || tag));
    }

    function renderAll() {
      const items = loadItems();
      renderTabs(items);
      renderSettingsList(items);
    }

    function resetForm() {
      document.getElementById('titleInput').value = '';
      document.getElementById('urlInput').value = '';
      document.getElementById('editIndex').value = '-1';
      document.getElementById('submitBtn').textContent = '登録する';
      document.getElementById('modalFormTitle').textContent = '停留所タブの追加';
      document.getElementById('cancelEditBtn').style.display = 'none';
    }

    // モーダル開閉
    const modal = document.getElementById('settingsModal');
    document.getElementById('openModalBtn').addEventListener('click', () => {
      resetForm();
      modal.classList.add('active');
    });
    document.getElementById('closeModalBtn').addEventListener('click', () => {
      modal.classList.remove('active');
    });
    document.getElementById('cancelEditBtn').addEventListener('click', resetForm);
    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.classList.remove('active');
    });

    // フォーム送信（登録・保存）
    document.getElementById('busForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const title = document.getElementById('titleInput').value.trim();
      let url = document.getElementById('urlInput').value.trim();
      const editIndex = parseInt(document.getElementById('editIndex').value, 10);

      // http が抜けていた場合の自動補正
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }

      const items = loadItems();
      if (editIndex >= 0 && editIndex < items.length) {
        items[editIndex] = { title, url };
      } else {
        items.push({ title, url });
      }

      saveItems(items);
      resetForm();
      renderAll();
    });

    // 初期値リセット
    document.getElementById('resetDefaultBtn').addEventListener('click', () => {
      if (confirm('初期設定のタブ一覧に戻しますか？')) {
        saveItems(DEFAULT_BUS_ITEMS);
        currentIndex = 0;
        resetForm();
        renderAll();
      }
    });

    // 全消去
    document.getElementById('clearAllBtn').addEventListener('click', () => {
      if (confirm('すべてのタブを消去しますか？')) {
        saveItems([]);
        currentIndex = 0;
        resetForm();
        renderAll();
      }
    });

    // 起動
    renderAll();
  </script>
</body>
</html>
